version: 2

# commit-message.prefix already carries the conventional-commit scope.
# Do not add `include: scope` alongside it. Dependabot appends its own
# "(deps)" on top, yielding "chore(deps)(deps): ..." which the PR-hygiene
# title lint rejects as an unknown scope.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - go

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - github-actions
